changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]

  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement

    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug

    - title: 📦 Dependencies
      labels:
        - dependencies

    - title: 🧰 Maintenance
      labels:
        - chore
        - ci
        - refactor

    - title: Other Changes
      labels:
        - "*"
