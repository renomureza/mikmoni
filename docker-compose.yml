services:
  routeros:
    # image: evilfreelancer/docker-routeros:6.49.21
    image: evilfreelancer/docker-routeros:7.23.5
    # restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/kvm # omit on Apple Silicon (no KVM there; container uses QEMU emulation)
    ports:
      - "2222:22"
      - "2223:23"
      - "8728:8728"
      - "8729:8729"
      - "8291:8291"
    volumes:
      - ./docker-data/routeros_data:/data
    networks:
      - default
      - routeros_net

  mikhmon:
    image: trianwar/mikhmon:latest
    ports:
      - "8080:8080"
    volumes:
      - ./docker-data/mikhmon:/var/www/mikhmon

networks:
  routeros_net:
    driver: bridge

